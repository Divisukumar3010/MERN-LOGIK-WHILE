<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Futuristic Weather App</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>


  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <!-- Search Section -->
  <div class="container-fluid" id="main_container">
    <h1 id="heading">🌌 Futuristic Weather App</h1>
    <button id="themeToggle" class="btn btn-sm btn-warning mb-3">
      🌙 Dark Mode
    </button>


    <form id="search_bar" class="d-flex">
      <input type="search" id="search_input" class="form-control me-2" placeholder="Enter city name" />
      <button class="btn btn-outline-info" type="submit">Search</button>
    </form>

    <div id="error" class="text-danger fw-bold mt-2"></div>
  </div>

  <!-- Current Weather -->
  <div class="container-fluid mt-4">
    <div class="row align-items-center">
      <div class="col-12 col-md-6">
        <div class="card weather_card mx-auto p-3 text-center">
          <h5 id="cityName">City</h5>
          <img id="weatherImg" class="weather-icon img-fluid mb-2" src="images/default.png" />
          <p id="temp" class="temp_display">__ °C</p>
          <p id="condition">---</p>
        </div>
      </div>

      <div class="col-12 col-md-6 text-center">
        <img id="weatherAvatar" class="avatar mt-3" src="images/default.png" />
      </div>
    </div>
  </div>

  <!-- Forecast -->
  <h1 id="heading" class="mt-5 text-center">5-Day Weather Forecast</h1>

  <div class="container-fluid" id="Future_data">
    <div class="row justify-content-center" id="forecastRow"></div>
  </div>

  <!-- JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>

</html>
